name: Tests

on:
  # Run testing on all push and pull requests that have committed changes in PHP files
  push:
    paths:
      - '**/*.php'
  pull_request:
    paths:
      - '**/*.php'
  # Make it possible to run the workflow manually
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ${{ matrix.os }}

    # Define the matrix of different PHP and dependency versions
    strategy:
      # Fail the whole workflow if one of the jobs fails
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.3 ]
        dependency-version: [ prefer-stable ]

    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / ${{ matrix.dependency-version }}

    # MariaDB service, using the same version as the Lando setup (.lando.dist.yml)
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eclipse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Override the Lando database settings from workbench/.env (copied from .env.example by the composer setup script)
    # and the SQLite defaults from phpunit.xml.dist, so the MariaDB service is used.
    # The root user is used, since parallel testing needs to create a database for each process.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eclipse_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TELESCOPE_ENABLED: false

    steps:

      #- name: Configure operating system
      #  if: matrix.os == 'ubuntu-latest'
      #  run: sudo apt-get update && sudo apt-get install -y locales locales-all

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: pdo_mysql

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --${{ matrix.dependency-version }}

      - name: Run test suite
        run: composer test -- --coverage-clover ./coverage.xml

      - name: Upload coverage reports to Codecov
        # Make sure the Codecov action is only executed once
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3' && matrix.dependency-version == 'prefer-stable'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
