laravel: './workbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations
  - database/migrations

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    views: false
  build:
    - asset-publish
    - db-wipe
    - migrate-fresh
    - db-seed
  assets:
    - laravel-assets
